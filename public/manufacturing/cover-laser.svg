<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Laser and fabrication">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <radialGradient id="spark" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ecfeff" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#22d3ee" stop-opacity=".6"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g stroke="#38bdf8" stroke-opacity=".08">
    <path d="M0 135H1200M0 270H1200M0 405H1200M0 540H1200"/>
    <path d="M200 0V675M400 0V675M600 0V675M800 0V675M1000 0V675"/>
  </g>
  <circle cx="960" cy="520" r="240" fill="#06b6d4" fill-opacity=".07"/>
  <g transform="translate(360 96)">
    <!-- laser head -->
    <rect x="196" y="0" width="100" height="86" rx="14" fill="#0f172a" stroke="#a5f3fc" stroke-width="7"/>
    <path d="M216 86 L276 86 L258 128 L234 128 Z" fill="#164e63" stroke="#a5f3fc" stroke-width="6"/>
    <!-- converging beam -->
    <path d="M238 128 L246 282 M254 128 L246 282" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-opacity=".9"/>
    <circle cx="246" cy="282" r="46" fill="url(#spark)"/>
    <!-- sparks -->
    <g stroke="#a5f3fc" stroke-width="5" stroke-linecap="round">
      <path d="M204 252 L188 236"/>
      <path d="M290 254 L308 240"/>
      <path d="M212 310 L194 322"/>
      <path d="M284 308 L302 320"/>
    </g>
    <!-- sheet with cut path -->
    <rect x="16" y="282" width="460" height="86" rx="12" fill="#134e4a" fill-opacity=".35" stroke="#2dd4bf" stroke-width="6"/>
    <path d="M58 326 H 196 M 246 326 Q 300 300 352 326 T 440 326" fill="none" stroke="#5eead4" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 14"/>
    <rect x="0" y="388" width="492" height="14" rx="7" fill="#155e75"/>
  </g>
  <text x="72" y="580" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="6" fill="#67e8f9" font-weight="bold">MARKETPLACEBETA · MANUFACTURING DESK</text>
  <text x="72" y="628" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#f8fafc" font-weight="bold">Laser &amp; fabrication</text>
</svg>
