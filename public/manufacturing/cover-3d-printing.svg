<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="3D printing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g stroke="#38bdf8" stroke-opacity=".08">
    <path d="M0 135H1200M0 270H1200M0 405H1200M0 540H1200"/>
    <path d="M200 0V675M400 0V675M600 0V675M800 0V675M1000 0V675"/>
  </g>
  <circle cx="920" cy="140" r="260" fill="#22d3ee" fill-opacity=".07"/>
  <g transform="translate(330 120)">
    <!-- gantry frame -->
    <rect x="0" y="0" width="540" height="26" rx="8" fill="none" stroke="#67e8f9" stroke-width="7"/>
    <rect x="0" y="0" width="26" height="380" rx="8" fill="none" stroke="#67e8f9" stroke-width="7"/>
    <rect x="514" y="0" width="26" height="380" rx="8" fill="none" stroke="#67e8f9" stroke-width="7"/>
    <!-- crossbar + print head -->
    <rect x="26" y="96" width="488" height="16" rx="6" fill="#0ea5e9" fill-opacity=".5"/>
    <rect x="236" y="84" width="70" height="52" rx="10" fill="#0f172a" stroke="#a5f3fc" stroke-width="6"/>
    <path d="M258 136 L284 136 L271 168 Z" fill="#a5f3fc"/>
    <path d="M271 168 V 212" stroke="url(#glow)" stroke-width="8" stroke-linecap="round"/>
    <!-- layered print -->
    <g fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round">
      <path d="M196 338 H 346"/>
      <path d="M206 314 H 336"/>
      <path d="M216 290 H 326"/>
      <path d="M228 266 H 314"/>
      <path d="M242 242 H 300"/>
      <path d="M256 218 H 286"/>
    </g>
    <!-- bed -->
    <rect x="96" y="356" width="350" height="18" rx="7" fill="#38bdf8" fill-opacity=".65"/>
    <rect x="56" y="392" width="430" height="14" rx="7" fill="#1e3a5f"/>
  </g>
  <text x="72" y="580" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="6" fill="#67e8f9" font-weight="bold">MARKETPLACEBETA · MANUFACTURING DESK</text>
  <text x="72" y="628" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#f8fafc" font-weight="bold">3D printing</text>
</svg>
